<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmishGuard | Forensic AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f1110;
            --container-bg: #1a1d1c;
            --accent-green: #00ff88; /* Emerald Green */
            --accent-warn: #ff9900;  /* Industrial Orange */
            --danger-red: #ff4444;
            --text-main: #e0e0e0;
            --border-muted: #2d3331;
        }

        body { 
            font-family: 'Roboto', sans-serif; 
            background-color: var(--bg-dark); 
            color: var(--text-main); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px; 
        }

        .container { 
            background-color: var(--container-bg); 
            padding: 2.5rem; 
            border-radius: 16px; 
            border: 1px solid var(--border-muted);
            box-shadow: 0 10px 30px rgba(0,0,0,0.7); 
            width: 100%; 
            max-width: 800px; 
            text-align: center; 
        }

        h1 { color: var(--accent-green); letter-spacing: 2px; margin-bottom: 2rem; font-weight: 700; }
        h2 { color: #888; font-size: 1.1rem; text-transform: uppercase; border-bottom: 1px solid var(--border-muted); padding-bottom: 8px; margin-top: 40px; }

        textarea { 
            width: 100%; height: 100px; padding: 15px; border-radius: 10px; 
            border: 1px solid var(--border-muted); background-color: #121514; 
            color: #fff; resize: none; font-size: 1rem; margin-bottom: 15px;
            transition: border 0.3s;
        }
        textarea:focus { border-color: var(--accent-green); outline: none; }

        /* Button Palette */
        .btn-main { width: 100%; padding: 14px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; font-size: 1rem; margin-top: 10px; }
        .btn-scan { background-color: var(--accent-green); color: #000; }
        .btn-scan:hover { background-color: #00cc6a; transform: translateY(-2px); }
        
        .btn-batch { background-color: var(--accent-warn); color: #000; margin-top: 20px; }
        .btn-batch:hover { background-color: #e68a00; }

        /* Progress Bar */
        .progress-container { width: 100%; background-color: #121514; border-radius: 20px; height: 8px; margin: 20px 0; display: none; overflow: hidden; }
        .progress-bar { width: 0%; height: 100%; background: linear-gradient(90deg, var(--accent-green), var(--accent-warn)); transition: width 0.4s ease; }

        /* Result Displays */
        #result { margin-top: 1.5rem; padding: 15px; border-radius: 8px; display: none; font-weight: bold; border: 1px solid transparent; }
        .safe { background-color: rgba(0, 255, 136, 0.1); color: var(--accent-green); border-color: var(--accent-green); }
        .danger { background-color: rgba(255, 68, 68, 0.1); color: var(--danger-red); border-color: var(--danger-red); }

        #batch-dashboard { display: none; margin-top: 25px; padding: 20px; background: #121514; border-radius: 12px; border: 1px solid var(--border-muted); }
        #batch-list { text-align: left; max-height: 450px; overflow-y: auto; margin-top: 15px; padding-right: 10px; }
        
        /* Custom Scrollbar */
        #batch-list::-webkit-scrollbar { width: 6px; }
        #batch-list::-webkit-scrollbar-thumb { background: var(--border-muted); border-radius: 10px; }

        .batch-card { 
            padding: 15px; border-bottom: 1px solid var(--border-muted); 
            display: grid; grid-template-columns: 80px 1fr 100px; gap: 15px; align-items: center;
        }
        .v-tag { padding: 4px 8px; border-radius: 5px; font-size: 0.7rem; font-weight: bold; text-align: center; }
        .v-safe { background: var(--accent-green); color: #000; }
        .v-danger { background: var(--danger-red); color: #fff; }

        .loader { border: 3px solid #222; border-top: 3px solid var(--accent-green); border-radius: 50%; width: 25px; height: 25px; animation: spin 0.8s linear infinite; margin: 15px auto; display: none; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="container">
        <h1>SMISHGUARD 🛡️</h1>
        
        <textarea id="smsText" placeholder="Inject suspicious message for forensic analysis..."></textarea>
        <button class="btn-main btn-scan" onclick="scanSMS()">Analyze Forensic Signature</button>
        <div id="result"></div>

        <h2>Network Batch Analysis</h2>
        <p style="font-size: 0.85rem; color: #666; margin-bottom: 5px;">Mass-processing signatures from <b>test_data.txt</b></p>
        <button id="btn-run-batch" class="btn-main btn-batch" onclick="runBatchScan()">Execute Batch Sequence</button>
        
        <div id="batch-loader" class="loader"></div>
        <div id="progress-wrap" class="progress-container">
            <div id="progress-bar" class="progress-bar"></div>
        </div>

        <div id="batch-dashboard">
            <div id="batch-summary" style="font-size: 1.1rem; margin-bottom: 20px;"></div>
            <div id="batch-list"></div>
        </div>
    </div>

    <script>
        async function scanSMS() {
            const text = document.getElementById('smsText').value;
            const resDiv = document.getElementById('result');
            if(!text) return;

            resDiv.style.display = "block"; resDiv.innerText = "Analyzing Vector..."; resDiv.className = "";

            try {
                const response = await fetch('/scan', { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' }, 
                    body: JSON.stringify({ text }) 
                });
                const data = await response.json();
                resDiv.innerHTML = `VERDICT: ${data.status} | confidence_${data.probability}<br><small>Logic: ${data.reason}</small>`;
                resDiv.className = data.status === "DANGER" ? "danger" : "safe";
            } catch (e) { resDiv.innerText = "Connection Interrupted."; }
        }

        async function runBatchScan() {
            const btn = document.getElementById('btn-run-batch');
            const progWrap = document.getElementById('progress-wrap');
            const bar = document.getElementById('progress-bar');
            const dash = document.getElementById('batch-dashboard');
            const list = document.getElementById('batch-list');
            const sum = document.getElementById('batch-summary');

            dash.style.display = 'none'; btn.disabled = true; progWrap.style.display = 'block';
            
            // Simulating progress states for UX
            bar.style.width = '20%';
            setTimeout(() => bar.style.width = '65%', 600);

            try {
                const response = await fetch('/batch_scan');
                const data = await response.json();
                bar.style.width = '100%';

                sum.innerHTML = `SCAN COMPLETE: <span style="color:var(--accent-green)">${data.summary.safe} SAFE</span> | <span style="color:var(--danger-red)">${data.summary.scam} MALICIOUS</span>`;
                
                list.innerHTML = data.details.map(item => `
                    <div class="batch-card">
                        <div class="v-tag ${item.status==='DANGER'?'v-danger':'v-safe'}">${item.status}</div>
                        <div style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">
                            <span style="font-size:0.9rem; color:#fff;">${item.text}</span><br>
                            <span style="font-size:0.7rem; color:#555;">${item.reason}</span>
                        </div>
                        <div style="text-align:right; font-weight:bold; color:var(--accent-green); font-size:0.8rem;">${item.score}</div>
                    </div>`).join('');

                setTimeout(() => {
                    progWrap.style.display = 'none'; dash.style.display = 'block'; 
                    btn.disabled = false; bar.style.width = '0%';
                }, 400);

            } catch (e) { alert("Forensic system offline."); btn.disabled = false; }
        }
    </script>
</body>
</html>
